<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>網頁講義已下線</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--fg:#1d2624;--mut:#5f6d69;--line:#d3dfdb;--acc:#1d6a58;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111816;--card:#1a2321;--fg:#e6eeeb;--mut:#9aaba6;--line:#2c3a37;--acc:#5fc4a6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;line-height:1.7;padding:40px max(16px,env(safe-area-inset-left,0px))}
.box{max-width:520px;margin:10vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
h1{font-size:22px;margin:0 0 8px;color:var(--acc)}
p{margin:6px 0;color:var(--mut)}
a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>這份網頁講義已下線</h1>
  <p>試閱已經結束，謝謝你的使用。</p>
  <p>This web handout is no longer available.</p>
  <p style="margin-top:16px"><a href="/">回 Astro Ni Lab 首頁</a></p>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>第 2 章網頁講義</title>
<style>
/* 配色沿用講義 css/lt.css（11/21 倪的眼睛第 8 條：新元件沿用原本的配色） */
:root{--bg:#f3f6f5;--card:#fff;--ink:#22323a;--sub:#5b6d72;--line:#d9e3e0;--acc:#196558;--on-acc:#fff;--bad:#c2372e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1517;--card:#172024;--ink:#e3ecec;--sub:#98a9ab;--line:#2a383c;--acc:#5cc2a8;--on-acc:#062a22;--bad:#ff7b72;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--sub);font-size:14px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
label.k{display:flex;gap:8px;align-items:center;margin:12px 0 0;color:var(--sub);font-size:14px}
label.k input{width:auto}
input:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
label.k input{accent-color:var(--acc)}
button{margin-top:16px;width:100%;min-height:48px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:var(--on-acc);cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin-top:10px}
</style>
</head>
<body>
<main><form id="f" autocomplete="off">
<h1>第 2 章網頁講義</h1>
<p>請輸入密碼（有分大小寫）。輸入一次，整個第 2 章都能看。</p>
<input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="密碼" autofocus>
<label class="k"><input id="keep" type="checkbox" checked>在這台裝置記住密碼（下次不用再輸入）</label>
<button type="submit">進入</button>
<div class="err" id="err" role="alert"></div>
</form></main>
<script>
(function () {
  var UNIT = "ch2", SALT = "io0T+L4fg/IaBL/ZTfTQLg==", ITER = 310000, ENC = "index.enc.json";
  var KEYNAME = 'lt-key-' + UNIT + '-' + SALT.slice(0, 8);
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function ub64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v, keep) { try { sessionStorage.setItem(k, v); if (keep) localStorage.setItem(k, v); } catch (e) {} }
  function drop(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {} }
  function derive(pw) {
    var te = new TextEncoder(), salt = b64(SALT), pre = te.encode('lt-' + UNIT + '|'), s = new Uint8Array(pre.length + salt.length);
    s.set(pre); s.set(salt, pre.length);
    return crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: s, iterations: ITER, hash: 'SHA-256' }, k, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function open(raw, keep) {
    return fetch(ENC, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); }).then(function (d) {
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, k, b64(d.ct));
      });
    }).then(function (plain) {
      if (!('DecompressionStream' in window)) throw new Error('old');
      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(function (html) {
      if (keep != null) put(KEYNAME, ub64(raw), keep);   // 解得開＝密碼對：先存金鑰再換頁（頁面裡的旁白解密要讀它）
      document.open(); document.write(html); document.close();
    });
  }
  var err = document.getElementById('err');
  function fail(e) {
    err.textContent = e && e.message === 'old' ? '這個瀏覽器太舊，請更新後再開。' : e && e.message === 'net' ? '連線失敗，請重新整理。' : '密碼不對，再試一次。';
  }
  var saved = get(KEYNAME);
  if (saved) open(b64(saved)).catch(function () { drop(KEYNAME); });
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault(); err.textContent = '解鎖中…';
    var pw = document.getElementById('pw').value, keep = document.getElementById('keep').checked;
    derive(pw).then(function (raw) { return open(raw, keep); }).catch(fail);
  });
})();
</script>
</body>
</html>
